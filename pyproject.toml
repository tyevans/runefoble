[project]
name = "runefoble-workspace"
version = "0.1.0"
description = "Runefoble - Collaborative AI-native TTRPG platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "runefoble-platform",
    "runefoble-auth",
    "runefoble-events",
    "runefoble-embeddings",
    "the-watcher",
    "game-session",
    "board-state",
    "character-sheet",
    "voice-agent",
    "inference-worker",
    "gateway-api",
    "gateway-mcp",
    "campaign-lore",
    "rules-compendium",
    "asset-forge",
    "soundscape",
    "campaign-analytics",
    "eventsource-py>=0.14.0",
    "redstring[llm,redis]>=0.11.0",
]

[tool.uv.sources]
runefoble-platform = { workspace = true }
runefoble-auth = { workspace = true }
runefoble-events = { workspace = true }
runefoble-embeddings = { workspace = true }
the-watcher = { workspace = true }
game-session = { workspace = true }
board-state = { workspace = true }
character-sheet = { workspace = true }
voice-agent = { workspace = true }
inference-worker = { workspace = true }
gateway-api = { workspace = true }
gateway-mcp = { workspace = true }
campaign-lore = { workspace = true }
rules-compendium = { workspace = true }
asset-forge = { workspace = true }
soundscape = { workspace = true }
campaign-analytics = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/*",
    "services/*",
    "gateway/*",
]
exclude = [
    # TypeScript packages share these folders with Python members (pnpm workspace).
    "libs/runefoble_ui",
    "services/audience_studio",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "httpx>=0.28.1",
    "mutmut>=3.8.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "ruff>=0.16.9",
    "zensical>=0.0.65",
    "pytest-timeout>=2.4.0",
    "import-linter>=2.16",
    "mypy>=1.19.0",
    "types-jsonschema>=4.26.0.20261006",
    "pytest-xdist>=3.8.0",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# The pydantic plugin reads BaseSettings and BaseModel fields, so aliased and
# env-backed fields are not reported as missing constructor arguments.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = [".", "deployments/zitadel_bootstrap/src"]
# Docker image tests are heavy. Run them with: uv run pytest -m docker tests/test_blackbox_deployability_images.py
addopts = "-m 'not docker'"
timeout = 300
timeout_method = "signal"
markers = [
    "docker: builds and runs Docker images; needs a reachable Docker daemon",
    "serial: checks wall-clock time or starts a browser; the gate runs it after the parallel run",
    "authz_live: runs against a live SpiceDB container with runefoble.zed loaded (make test-authz-live)",
]

[tool.importlinter]
root_packages = ["game_session", "voice_agent", "gateway_api", "the_watcher", "board_state", "character_sheet", "campaign_lore", "inference_worker", "rules_compendium", "asset_forge", "soundscape", "campaign_analytics"]

[[tool.importlinter.contracts]]
name = "game_session must not import voice_agent in process (ADR-0007, ADR-0015)"
type = "forbidden"
source_modules = ["game_session"]
forbidden_modules = ["voice_agent"]

# The gateway stays thin (ADR-0015 b). It reaches each owner over HTTP through ServiceClient.
[[tool.importlinter.contracts]]
name = "gateway_api must not import a service package (ADR-0015 b, TASK-0775)"
type = "forbidden"
source_modules = ["gateway_api"]
forbidden_modules = ["the_watcher", "game_session", "board_state", "character_sheet", "voice_agent", "campaign_lore", "inference_worker", "rules_compendium", "asset_forge", "soundscape", "campaign_analytics"]

[tool.mutmut]
source_paths = ["libs/runefoble_platform/src/", "services/the_watcher/src/"]
pytest_add_cli_args_test_selection = ["tests/"]
