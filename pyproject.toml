[project]
name = "runefoble-workspace"
version = "0.1.0"
description = "Runefoble - Collaborative AI-native TTRPG platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "runefoble-platform",
    "runefoble-auth",
    "runefoble-events",
    "the-watcher",
    "game-session",
    "board-state",
    "character-sheet",
    "voice-agent",
    "inference-worker",
    "gateway-api",
    "gateway-mcp",
    "campaign-lore",
    "rules-compendium",
    "asset-forge",
    "soundscape",
    "eventsource-py>=0.14.0",
    "redstring[llm,redis]>=0.11.0",
]

[tool.uv.sources]
runefoble-platform = { workspace = true }
runefoble-auth = { workspace = true }
runefoble-events = { workspace = true }
the-watcher = { workspace = true }
game-session = { workspace = true }
board-state = { workspace = true }
character-sheet = { workspace = true }
voice-agent = { workspace = true }
inference-worker = { workspace = true }
gateway-api = { workspace = true }
gateway-mcp = { workspace = true }
campaign-lore = { workspace = true }
rules-compendium = { workspace = true }
asset-forge = { workspace = true }
soundscape = { workspace = true }

[tool.uv.workspace]
members = [
    "libs/*",
    "services/*",
    "gateway/*",
]
exclude = [
    "services/audience_studio",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "httpx>=0.28.1",
    "mutmut>=3.8.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "ruff>=0.16.9",
    "zensical>=0.0.65",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mutmut]
paths_to_mutate = "libs/runefoble_platform/src/,services/the_watcher/src/"
tests_dir = "tests/"
runner = "pytest"
