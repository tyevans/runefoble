    { "Decompose Microservice Routers" = "how-to/decompose-microservice-routers.md" },
    { "Configure Appearance & Themes" = "how-to/configure-appearance-and-themes.md" },
    { "Tactile Board & Ghost Previews" = "how-to/interact-with-tactile-board-and-ghost-previews.md" },
    { "Orchestrate Audience Chaos Polls" = "how-to/orchestrate-audience-chaos-polls.md" },
    { "Project Campaign Analytics & Chronicle Timeline" = "how-to/project-campaign-analytics-and-chronicle-timeline.md" },
