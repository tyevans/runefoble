[project]
name = "inference-worker"
version = "0.1.0"
description = "Runefoble LangGraph-powered distributed AI inference worker for The Watcher and Stand-in AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "httpx>=0.28.1",
    "redis>=8.1.0",
    "runefoble-platform",
    "runefoble-events",
]

[project.scripts]
runefoble-inference-worker = "inference_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
