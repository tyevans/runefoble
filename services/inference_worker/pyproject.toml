[project]
name = "inference-worker"
version = "0.1.0"
description = "Runefoble LangGraph-powered distributed AI inference worker for The Watcher and Stand-in AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "runefoble-platform",
    "runefoble-events",
]

[project.scripts]
runefoble-inference-worker = "inference_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
