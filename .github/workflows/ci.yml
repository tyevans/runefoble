name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-quality:
    name: Python Lint, Tests & Properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.22.0

      - name: Install workspace Node dependencies & build services
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Lint Check
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Test Suite
        run: uv run pytest

  frontend-quality:
    name: Frontend TypeScript, Build & Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.22.0

      - name: Install dependencies
        run: cd frontend && pnpm install

      - name: Typecheck Frontend
        run: cd frontend && pnpm exec tsc --noEmit

      - name: Build Application
        run: cd frontend && pnpm run build

      - name: Build Static Storybook
        run: cd frontend && pnpm exec storybook build --disable-telemetry --quiet

  helm-lint:
    name: Helm Lint & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint
        run: helm lint deployments/helm/runefoble

      - name: Helm Template
        run: helm template runefoble deployments/helm/runefoble

  docs-verification:
    name: Docs & Visualizer Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Verify Docs, Visualizer & Storybook Build
        run: make docs-build

  e2e-playwright:
    name: Playwright BDD End-to-End Quality Gate
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.22.0

      - name: Install Python dependencies
        run: uv sync

      - name: Install workspace Node dependencies & build services
        run: pnpm install --frozen-lockfile && pnpm run build

      - name: Cache Playwright browser binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright system dependencies
        run: pnpm exec playwright install --with-deps

      - name: Start development services in background
        run: |
          make dev &
        env:
          GATEWAY_PORT: 8000
          FRONTEND_PORT: 5173
          SPICEDB_ENDPOINT: "mock"
          RUNEFOBLE_SPICEDB_ENDPOINT: "mock"
          AUTH_DEV_MODE: "true"
          RUNEFOBLE_AUTH_DEV_MODE: "true"
          REDIS_URL: "redis://localhost:6379/0"
          RUNEFOBLE_REDIS_URL: "redis://localhost:6379/0"

      - name: Poll service readiness
        run: |
          echo "Waiting for API Gateway and Vite Frontend to become ready..."
          timeout 60 bash -c '
            until curl -sf http://localhost:8000/api/v1/health > /dev/null && curl -sf http://localhost:5173 > /dev/null; do
              echo "Services pending readiness, sleeping 2s..."
              sleep 2
            done
            echo "API Gateway and Vite Frontend are ready!"
          '

      - name: Run Playwright BDD test suite
        run: make test-e2e ARGS="--reporter=github,html"
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "http://localhost:5173"
          SPICEDB_ENDPOINT: "mock"
          RUNEFOBLE_SPICEDB_ENDPOINT: "mock"
          AUTH_DEV_MODE: "true"
          RUNEFOBLE_AUTH_DEV_MODE: "true"
          REDIS_URL: "redis://localhost:6379/0"
          RUNEFOBLE_REDIS_URL: "redis://localhost:6379/0"

      - name: Archive Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 14

