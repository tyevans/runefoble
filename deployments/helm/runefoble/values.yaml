# Default values for runefoble Helm chart

global:
  environment: local
  domain: runefoble.local

# Credentials. The chart renders them into the Secret `runefoble-credentials`, and every
# workload reads them with secretKeyRef. The values below are DEV-ONLY defaults for the local
# Kind cluster. They are public in this repository. Never deploy them to a shared cluster.
# For any environment other than `local`, set `credentials.existingSecret` to the name of a
# Secret you manage. The chart then renders no Secret, and it fails if that name is empty.
# The existing Secret must hold the keys listed in templates/secret.yaml.
credentials:
  existingSecret: ""
  silo:
    accessKey: silo_admin           # DEV-ONLY
    secretKey: silo_secret_pass     # DEV-ONLY
  zitadel:
    masterKey: RunefobleMasterKeyMustBe32Bytes!   # DEV-ONLY
    adminPassword: RunefobleAdminPassword123!     # DEV-ONLY
  spicedb:
    presharedKey: runefoble_secret_key            # DEV-ONLY
  postgres:
    password: runefoble_dev_password              # DEV-ONLY
  grafana:
    adminPassword: admin                          # DEV-ONLY
  # Service-to-service credential (ADR-0015 e). The chart sets it for gateway-api, the-watcher,
  # board-state, character-sheet, game-session, rules-compendium, inference-worker, and gateway-mcp.
  # The other services do not read it. In a non-local environment, supply it in the existingSecret.
  serviceCredential: runefoble-dev-service-credential   # DEV-ONLY

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: runefoble.local
      paths:
        - path: /api
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /docs
          pathType: Prefix
          service: swagger-ui
          port: 8080
        - path: /swagger-ui
          pathType: Prefix
          service: swagger-ui
          port: 8080
        - path: /analytics
          pathType: Prefix
          service: openpanel
          port: 3000
        - path: /mail
          pathType: Prefix
          service: mailpit
          port: 8025
        - path: /mailpit
          pathType: Prefix
          service: mailpit
          port: 8025
        - path: /ws
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /healthz
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    - host: localhost
      paths:
        - path: /api
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /docs
          pathType: Prefix
          service: swagger-ui
          port: 8080
        - path: /swagger-ui
          pathType: Prefix
          service: swagger-ui
          port: 8080
        - path: /analytics
          pathType: Prefix
          service: openpanel
          port: 3000
        - path: /mail
          pathType: Prefix
          service: mailpit
          port: 8025
        - path: /mailpit
          pathType: Prefix
          service: mailpit
          port: 8025
        - path: /ws
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /healthz
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    # Browser-facing Zitadel host. Zitadel serves only its own root path, so it
    # cannot sit under /auth. Must equal zitadel.externalDomain.
    - host: auth.localhost
      paths:
        - path: /
          pathType: Prefix
          service: zitadel
          port: 8080

# Database
postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  database: runefoble
  username: runefoble_user
  port: 5432
  # The data claim of the StatefulSet. It holds every event store, the Zitadel and SpiceDB data,
  # and the OpenPanel data. Deleting the claim deletes the data. An empty storageClass uses the
  # cluster default (the Kind default is `standard`).
  persistence:
    size: 5Gi
    storageClass: ""

# Event Streaming & In-Memory Cache (Redis)
redis:
  enabled: true
  image: redis:7.2-alpine
  port: 6379
  # The append-only file lives on this claim. Stream entries and consumer group positions survive a restart.
  persistence:
    size: 1Gi
    storageClass: ""
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Object Storage (Silo / MinIO fork)
silo:
  enabled: true
  # Chainguard builds MinIO. minio/minio no longer publishes images to Docker Hub. Pinned by digest.
  image: cgr.dev/chainguard/minio@sha256:7618b82bba99aadd77fcf59eb6cfd89b4b8b8e01ac796c474d57a1c1abf17e79
  port: 9000
  consolePort: 9001
  # Buckets that the bucket Job (silo-buckets-job.yaml) creates after install and upgrade.
  # The Job skips a bucket that exists.
  buckets:
    - runefoble-assets
    - runefoble-recordings
  bucketJob:
    enabled: true
    # Chainguard builds the MinIO client, from the same source as the Silo image. Pinned by digest.
    image: cgr.dev/chainguard/minio-client@sha256:47e7c343d1e0f0ae23ebd23d3ed095dffaa0ac397ec75a871829a6f9e075134c
    # Pod restarts before the Job fails. The Job restarts until Silo answers.
    backoffLimit: 10
  # The data claim of the StatefulSet. It holds every stored object. An empty storageClass uses the
  # cluster default.
  persistence:
    size: 10Gi
    storageClass: ""

# Identity & Authentication (Zitadel self-hosted)
zitadel:
  enabled: true
  image: ghcr.io/zitadel/zitadel:v2.54.0
  port: 8080
  # Browser-facing issuer parts. Zitadel writes the issuer into the token `iss` claim.
  # Zitadel serves only the configured host, protocol, and port.
  externalDomain: auth.localhost
  externalPort: 80
  externalSecure: false
  adminEmail: admin@runefoble.local
  # Bootstrap Job (zitadel-bootstrap.yaml). It creates the OIDC project and web application and
  # writes their generated IDs to the Secret named by client.secretName. The Job is a Helm hook.
  bootstrap:
    # Set to false for the first install. See docs/how-to/authenticate-with-zitadel-oidc.md.
    enabled: true
    # Secret that the Zitadel pod writes at run time. It holds the Zitadel admin personal access
    # token under the key `pat`. The pat-publisher sidecar in the Zitadel pod creates it. No
    # manual step is needed.
    adminSecret: zitadel-admin
    # Machine user that Zitadel creates on first start, with the IAM_OWNER role. Its personal
    # access token is the admin token for the Job.
    machineUsername: runefoble-bootstrap
    # Expiry of that token. Dev default. Set a short date for any shared cluster.
    patExpirationDate: "2099-01-01T00:00:00Z"
    projectName: runefoble
    appName: runefoble-web
    # The App Shell callback and the page that it opens after sign-out. Must match the origin
    # that browsers use for the App Shell.
    redirectUris:
      - http://localhost/auth/callback
    postLogoutRedirectUris:
      - http://localhost/
    # Allows http redirect URIs. Local Kind only. Set false behind TLS.
    devMode: true
  # Kubernetes Secret written by the bootstrap Job. Keys: project-id, client-id.
  client:
    secretName: runefoble-zitadel-client

# Zanzibar Authorization (SpiceDB self-hosted)
spicedb:
  enabled: true
  image: authzed/spicedb:v1.34.0
  grpcPort: 50051
  httpPort: 8443
  schemaJob:
    enabled: true
    image: authzed/zed:v0.25.0
    backoffLimit: 10

# Analytics (OpenPanel self-hosted)
openpanel:
  enabled: true
  image: lindesvard/openpanel-dashboard:2.3.0
  port: 3000

# Email Testing & Mock SMTP (Mailpit)
mailpit:
  enabled: true
  image: axllent/mailpit:v1.21.8
  smtpPort: 1025
  httpPort: 8025
  webroot: /mail/

# Observability (OpenTelemetry, Grafana, Loki)
observability:
  enabled: true
  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    grpcPort: 4317
    httpPort: 4318
  loki:
    image: grafana/loki:3.0.0
    port: 3100
  grafana:
    image: grafana/grafana:11.0.0
    port: 3001

# OpenAPI Swagger UI Aggregator
swaggerUI:
  enabled: true
  image: swaggerapi/swagger-ui:v5.17.14
  port: 8080
  # Entries come from the services map: every service with swaggerName is listed.

# Services. This map is the single service catalogue. The chart renders every entry (except the
# two that set ownTemplate) into a Deployment and a Service named after the key in kebab-case.
# The same entry gives the port, the Swagger UI row (swaggerName), and the cross-service URL
# (urlEnv on the target, consumers lists the containers that receive it).
#
# Per-service keys:
#   image, replicas, port        Container image, replica count, container and Service port.
#   swaggerName                  Title in the Swagger UI hub. Omit to leave the service out.
#   urlEnv, consumers            Env var that holds http://<name>:<port> on each consumer.
#   env                          Plain env vars. Empty values are not rendered.
#   serviceCredential            true: the service reads RUNEFOBLE_SERVICE_CREDENTIAL (ADR-0015 e).
#   siloCredentials              true: the service reads the Silo access and secret keys.
#   siloEndpoint, eventStore,    Default true. Set false when the service never had the variable.
#   environment
#   databaseDriver               SQLAlchemy URL driver. Default postgresql+asyncpg.
#   configMap                    Keys of the <name>-config ConfigMap that is loaded with envFrom.
#   readinessPath, livenessPath  HTTP probe paths on the service port.
#   modelCache, podSecurityContext  Volume for model files, and the pod security context.
services:
  gatewayApi:
    swaggerName: "Unified API Gateway"
    image: runefoble/gateway-api:0.1.0
    replicas: 1
    port: 8000
    serviceCredential: true
  theWatcher:
    swaggerName: "The Watcher AI Engine"
    image: runefoble/the-watcher:0.1.0
    replicas: 1
    port: 8001
    urlEnv: RUNEFOBLE_WATCHER_URL
    consumers: [game-session, voice-agent, gateway-api, gateway-mcp]
    serviceCredential: true
    env:
      # Selects the engine adapter for every Watcher port (ADR-0015 decision 4). The worker
      # URL comes from services.inferenceWorker. Start-up fails when that URL is missing.
      RUNEFOBLE_WATCHER_ENGINE: inference_worker
  boardState:
    swaggerName: "Board State Engine"
    image: runefoble/board-state:0.1.0
    replicas: 1
    port: 8002
    urlEnv: RUNEFOBLE_BOARD_STATE_URL
    consumers: [gateway-api, gateway-mcp]
    serviceCredential: true
    # The UVTT import stores map images in Silo with signed requests (TASK-0926).
    siloCredentials: true
  characterSheet:
    swaggerName: "Character Sheet Service"
    image: runefoble/character-sheet:0.1.0
    replicas: 1
    port: 8003
    urlEnv: RUNEFOBLE_CHARACTER_SHEET_URL
    consumers: [game-session, gateway-api, gateway-mcp]
    serviceCredential: true
  gameSession:
    swaggerName: "Game Session Service"
    image: runefoble/game-session:0.1.0
    replicas: 1
    port: 8004
    urlEnv: RUNEFOBLE_GAME_SESSION_URL
    consumers: [gateway-api, campaign-lore, gateway-mcp]
    serviceCredential: true
  voiceAgent:
    swaggerName: "Voice Agent Service"
    image: runefoble/voice-agent:0.1.0
    replicas: 1
    port: 8005
    urlEnv: RUNEFOBLE_VOICE_AGENT_URL
    consumers: [game-session, gateway-api]
    # The Watcher port sends the service credential on each transcript forward (TASK-0732).
    serviceCredential: true
    readinessPath: /healthz
    # Speech-to-text engine. faster-whisper runs in-process and needs the model cache below.
    # whisper-cpp calls a whisper.cpp HTTP server at sttBaseUrl (for example http://<host>:8080)
    # and needs no model cache. The chart drops the cache volume for whisper-cpp.
    sttEngine: faster-whisper
    sttBaseUrl: ""
    # faster-whisper model. Pre-fetched into modelCache by make voice-model-cache.
    # RUNEFOBLE_VOICE_STT_MODEL_DIR must equal modelCache.mountPath.
    env:
      RUNEFOBLE_VOICE_STT_MODEL_SIZE: tiny.en
      RUNEFOBLE_VOICE_STT_MODEL_DIR: /var/lib/runefoble/whisper
      RUNEFOBLE_VOICE_STT_DOWNLOAD_ENABLED: "false"
    modelCache:
      size: 1Gi
      mountPath: /var/lib/runefoble/whisper
    podSecurityContext:
      fsGroup: 10001
  campaignLore:
    swaggerName: "Campaign Lore Service"
    image: runefoble/campaign-lore:0.1.0
    replicas: 1
    port: 8006
    urlEnv: RUNEFOBLE_CAMPAIGN_LORE_URL
    consumers: [gateway-api]
    serviceCredential: true
    # Embedding endpoint for entity and passage search (ADR-0015). Entries with an empty
    # value are not rendered, so start-up names each missing setting and stops.
    env:
      RUNEFOBLE_EMBEDDING_BASE_URL: ""   # OpenAI-compatible base URL, including /v1
      RUNEFOBLE_EMBEDDING_MODEL: ""
      RUNEFOBLE_EMBEDDING_DIMENSION: ""  # Vector width the model returns
    # Kubernetes Secret that holds the endpoint key under the key "api-key". The chart renders it
    # only when global.environment is local (an empty placeholder). Other environments create it.
    embeddingApiKeySecret: campaign-lore-embedding
  rulesCompendium:
    swaggerName: "Rules Compendium Service"
    image: runefoble/rules-compendium:0.1.0
    replicas: 1
    port: 8007
    urlEnv: RUNEFOBLE_RULES_COMPENDIUM_URL
    # game-session reads enemy challenge ratings at encounter start (TASK-0918).
    consumers: [game-session, gateway-api, gateway-mcp]
    serviceCredential: true
  assetForge:
    swaggerName: "Asset Forge Service"
    image: runefoble/asset-forge:0.1.0
    replicas: 1
    port: 8008
    urlEnv: RUNEFOBLE_ASSET_FORGE_URL
    consumers: [gateway-api]
    siloCredentials: true
    environment: false
    configMap:
      FORGE_DEFAULT_THEME: "dungeon"
      FORGE_MAX_GRID_DIMENSION: "50"
      FORGE_MIN_GRID_DIMENSION: "5"
      FORGE_DEFAULT_STORAGE_BUCKET: "runefoble-assets"
  soundscape:
    swaggerName: "Soundscape Service"
    image: runefoble/soundscape:0.1.0
    replicas: 1
    port: 8009
    urlEnv: RUNEFOBLE_SOUNDSCAPE_URL
    consumers: [gateway-api]
    siloCredentials: true
    environment: false
    configMap:
      SOUNDSCAPE_DEFAULT_MOOD: "exploration"
      SOUNDSCAPE_DEFAULT_VOLUME: "1.0"
      SOUNDSCAPE_CROSSFADE_MS: "1500"
  audienceStudio:
    # Node service. It keeps a plain postgresql:// URL for its driver. It owns aggregate state
    # (AudienceEventRepository), so the PostgreSQL event store is on.
    swaggerName: "Audience Studio Service"
    image: runefoble/audience-studio:0.1.0
    replicas: 1
    port: 8010
    urlEnv: RUNEFOBLE_AUDIENCE_STUDIO_URL
    consumers: [gateway-api]
    databaseDriver: postgresql
    eventStore: true
    siloEndpoint: false
    environment: false
    readinessPath: /readyz
    livenessPath: /healthz
    configMap:
      PORT: "8010"          # Must equal port.
      HOST: "0.0.0.0"
      NODE_ENV: "production"
  campaignAnalytics:
    swaggerName: "Campaign Analytics Service"
    image: runefoble/campaign-analytics:0.1.0
    replicas: 1
    port: 8011
    urlEnv: RUNEFOBLE_CAMPAIGN_ANALYTICS_URL
    consumers: [gateway-api]
    siloEndpoint: false
    environment: false
    configMap:
      CAMPAIGN_ANALYTICS_HEATMAP_CELL_SIZE: "5"
      CAMPAIGN_ANALYTICS_DEFAULT_LIMIT: "50"
  inferenceWorker:
    # Rendered by templates/inference-worker.yaml (ownTemplate).
    swaggerName: "Inference Worker Service"
    ownTemplate: true
    urlEnv: RUNEFOBLE_INFERENCE_URL
    consumers: [the-watcher]
    # Explicit inference backend: openai_compatible or ollama. The worker has no canned engine.
    # The worker checks the selected engine at start-up and refuses to start when it does not answer.
    image: runefoble/inference-worker:0.1.0
    replicas: 1
    port: 8100
    backend: openai_compatible
    # Required when backend is openai_compatible. Empty means no base URL is set, so the worker
    # refuses to start until an endpoint is configured.
    openaiCompatibleBaseUrl: ""
    # Model name on the OpenAI-compatible endpoint. Empty keeps the worker default.
    openaiCompatibleModel: ""
  gatewayMcp:
    # MCP protocol over streamable HTTP at /mcp. ClusterIP only: no ingress path (ADR-0001).
    # Tools keep their state in memory, so run one replica. Rendered by templates/gateway-mcp.yaml
    # (ownTemplate). Its upstream URLs come from the urlEnv and consumers of each target service.
    swaggerName: "Gateway MCP Tool Registry"
    ownTemplate: true
    image: runefoble/gateway-mcp:0.1.0
    replicas: 1
    port: 8012

# Frontend Application
frontend:
  image: runefoble/frontend:0.1.0
  replicas: 1
  port: 80
  # Rendered to /runtime-config.json. Holds no secret. The client ID and the project ID come
  # from the Secret that the bootstrap Job writes. An init container fills them in at start.
  runtimeConfig:
    scopes:
      - openid
      - profile
      - email
      - offline_access
    providerName: Zitadel
