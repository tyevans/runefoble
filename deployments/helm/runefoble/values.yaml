# Default values for runefoble Helm chart

global:
  environment: local
  domain: runefoble.local

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  hosts:
    - host: runefoble.local
      paths:
        - path: /api
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /docs
          pathType: Prefix
          service: swagger-ui
          port: 8080
        - path: /swagger-ui
          pathType: Prefix
          service: swagger-ui
          port: 8080
        - path: /analytics
          pathType: Prefix
          service: openpanel
          port: 3000
        - path: /mail
          pathType: Prefix
          service: mailpit
          port: 8025
        - path: /mailpit
          pathType: Prefix
          service: mailpit
          port: 8025
        - path: /ws
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    - host: localhost
      paths:
        - path: /api
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /docs
          pathType: Prefix
          service: swagger-ui
          port: 8080
        - path: /swagger-ui
          pathType: Prefix
          service: swagger-ui
          port: 8080
        - path: /analytics
          pathType: Prefix
          service: openpanel
          port: 3000
        - path: /mail
          pathType: Prefix
          service: mailpit
          port: 8025
        - path: /mailpit
          pathType: Prefix
          service: mailpit
          port: 8025
        - path: /ws
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    # Browser-facing Zitadel host. Zitadel serves only its own root path, so it
    # cannot sit under /auth. Must equal zitadel.externalDomain.
    - host: auth.localhost
      paths:
        - path: /
          pathType: Prefix
          service: zitadel
          port: 8080

# Database
postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  database: runefoble
  username: runefoble_user
  password: runefoble_dev_password
  port: 5432
  storageSize: 5Gi

# Event Streaming & In-Memory Cache (Redis)
redis:
  enabled: true
  image: redis:7.2-alpine
  port: 6379
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Object Storage (Silo / MinIO fork)
silo:
  enabled: true
  image: minio/minio:RELEASE.2024-01-01T00-00-00Z
  accessKey: silo_admin
  secretKey: silo_secret_pass
  port: 9000
  consolePort: 9001
  buckets:
    - runefoble-assets
    - runefoble-recordings

# Identity & Authentication (Zitadel self-hosted)
zitadel:
  enabled: true
  image: ghcr.io/zitadel/zitadel:v2.54.0
  port: 8080
  # Browser-facing issuer parts. Zitadel writes the issuer into the token `iss` claim.
  # Zitadel serves only the configured host, protocol, and port.
  externalDomain: auth.localhost
  externalPort: 80
  externalSecure: false
  adminEmail: admin@runefoble.local
  adminPassword: RunefobleAdminPassword123!
  masterKey: RunefobleMasterKeyMustBe32Bytes!

# Zanzibar Authorization (SpiceDB self-hosted)
spicedb:
  enabled: true
  image: authzed/spicedb:v1.34.0
  grpcPort: 50051
  httpPort: 8443
  presharedKey: runefoble_secret_key
  schemaJob:
    enabled: true
    image: authzed/zed:latest
    backoffLimit: 10

# Analytics (OpenPanel self-hosted)
openpanel:
  enabled: true
  image: openpanel/openpanel:latest
  port: 3000

# Email Testing & Mock SMTP (Mailpit)
mailpit:
  enabled: true
  image: axllent/mailpit:v1.21.8
  smtpPort: 1025
  httpPort: 8025
  webroot: /mail/

# Observability (OpenTelemetry, Grafana, Loki)
observability:
  enabled: true
  otelCollector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    grpcPort: 4317
    httpPort: 4318
  loki:
    image: grafana/loki:3.0.0
    port: 3100
  grafana:
    image: grafana/grafana:11.0.0
    port: 3001
    adminPassword: admin

# OpenAPI Swagger UI Aggregator
swaggerUI:
  enabled: true
  image: swaggerapi/swagger-ui:v5.17.14
  port: 8080
  urls:
    - name: "Unified API Gateway"
      url: "http://gateway-api:8000/openapi.json"
    - name: "The Watcher AI Engine"
      url: "http://the-watcher:8001/openapi.json"
    - name: "Board State Engine"
      url: "http://board-state:8002/openapi.json"
    - name: "Character Sheet Service"
      url: "http://character-sheet:8003/openapi.json"
    - name: "Game Session Service"
      url: "http://game-session:8004/openapi.json"
    - name: "Voice Agent Service"
      url: "http://voice-agent:8005/openapi.json"
    - name: "Campaign Lore Service"
      url: "http://campaign-lore:8006/openapi.json"
    - name: "Rules Compendium Service"
      url: "http://rules-compendium:8007/openapi.json"
    - name: "Asset Forge Service"
      url: "http://asset-forge:8008/openapi.json"
    - name: "Soundscape Service"
      url: "http://soundscape:8009/openapi.json"
    - name: "Audience Studio Service"
      url: "http://audience-studio:8010/openapi.json"
    - name: "Campaign Analytics Service"
      url: "http://campaign-analytics:8011/openapi.json"

# Services
services:
  gatewayApi:
    image: runefoble/gateway-api:0.1.0
    replicas: 1
    port: 8000
  theWatcher:
    image: runefoble/the-watcher:0.1.0
    replicas: 1
    port: 8001
  boardState:
    image: runefoble/board-state:0.1.0
    replicas: 1
    port: 8002
  characterSheet:
    image: runefoble/character-sheet:0.1.0
    replicas: 1
    port: 8003
  gameSession:
    image: runefoble/game-session:0.1.0
    replicas: 1
    port: 8004
  voiceAgent:
    image: runefoble/voice-agent:0.1.0
    replicas: 1
    port: 8005
    # faster-whisper model name. The model is pre-fetched into modelCache (make voice-model-cache).
    sttModelSize: tiny.en
    modelCache:
      size: 1Gi
      mountPath: /var/lib/runefoble/whisper
  campaignLore:
    image: runefoble/campaign-lore:0.1.0
    replicas: 1
    port: 8006
    # Embedding endpoint for entity and passage search (ADR-0015). Entries with an empty
    # value are not rendered, so start-up names each missing setting and stops.
    env:
      RUNEFOBLE_EMBEDDING_BASE_URL: ""   # OpenAI-compatible base URL, including /v1
      RUNEFOBLE_EMBEDDING_MODEL: ""
      RUNEFOBLE_EMBEDDING_DIMENSION: ""  # Vector width the model returns
    # Kubernetes Secret that holds the endpoint key under the key "api-key". It is not
    # created by this chart. Local servers ignore the key, but the Secret must still exist.
    embeddingApiKeySecret: campaign-lore-embedding
  rulesCompendium:
    image: runefoble/rules-compendium:0.1.0
    replicas: 1
    port: 8007
  assetForge:
    image: runefoble/asset-forge:0.1.0
    replicas: 1
    port: 8008
  soundscape:
    image: runefoble/soundscape:0.1.0
    replicas: 1
    port: 8009
  audienceStudio:
    image: runefoble/audience-studio:0.1.0
    replicas: 1
    port: 8010
  campaignAnalytics:
    image: runefoble/campaign-analytics:0.1.0
    replicas: 1
    port: 8011
  gatewayMcp:
    # Upstream URLs that MCP tools call over HTTP (BOARD_STATE_URL, GAME_SESSION_URL, RULES_COMPENDIUM_URL).
    # No gateway-mcp deployment template exists yet; these values are for that template.
    boardStateUrl: "http://board-state:8002"
    gameSessionUrl: "http://game-session:8004"
    rulesCompendiumUrl: "http://rules-compendium:8007"

# Frontend Application
frontend:
  image: runefoble/frontend:0.1.0
  replicas: 1
  port: 80
  # Rendered to /runtime-config.json. Holds no secret. Zitadel generates the client ID,
  # so set clientId after the application is provisioned.
  runtimeConfig:
    clientId: ""
    scopes:
      - openid
      - profile
      - email
    providerName: Zitadel
