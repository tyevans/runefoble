# Hosted values profile (TASK-0955). Copy this file to a file that you keep outside the repository.
# Replace every REPLACE-ME with your own value. Then render and deploy with:
#   helm template runefoble deployments/helm/runefoble -f <your-hosted-values.yaml>
# The chart fails the render until every REPLACE-ME is gone and no development default remains.
# Do not put a credential value in this file. Create the Secret named in credentials.existingSecret.
# See docs/reference/hosted-profile.md for every key and the check that guards it.
global:
  environment: production
  domain: REPLACE-ME

# Name of a Secret that you create. It holds the keys listed in templates/secret.yaml.
credentials:
  existingSecret: runefoble-hosted-credentials

ingress:
  # Serve HTTPS only. Plain HTTP answers 301 to HTTPS. The guard rejects false.
  httpsRedirect: true
  tls:
    # certManager: name of a ClusterIssuer that you install (ACME or a private CA).
    # existingSecret: name of a kubernetes.io/tls Secret that you create. Set one source only.
    mode: certManager
    clusterIssuer: REPLACE-ME
    secretName: ""
  hosts:
    - host: REPLACE-ME
      paths:
        - path: /api
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /ws/boards
          pathType: Prefix
          service: board-state
          port: 8002
        - path: /ws
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /healthz
          pathType: Prefix
          service: gateway-api
          port: 8000
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    # Browser-facing Zitadel host. It must equal zitadel.externalDomain.
    - host: auth.REPLACE-ME
      paths:
        - path: /
          pathType: Prefix
          service: zitadel
          port: 8080

zitadel:
  externalDomain: auth.REPLACE-ME
  externalPort: 443
  externalSecure: true
  # Operator mail address for the first admin account.
  adminEmail: admin@REPLACE-ME
  bootstrap:
    # Short expiry for the bootstrap token. Set a date that suits your rotation policy.
    patExpirationDate: "2027-01-01T00:00:00Z"
    redirectUris:
      - https://REPLACE-ME/auth/callback
    postLogoutRedirectUris:
      - https://REPLACE-ME/
    devMode: false

# Development-only workloads. A hosted render runs without them (PRD-0025 outcome 4).
# Mailpit captures mail. Swagger UI lists the OpenAPI specs. OpenPanel is analytics (D6: off).
# Each service still serves /openapi.json inside the cluster. No public route reaches them.
mailpit:
  enabled: false
swaggerUI:
  enabled: false
openpanel:
  enabled: false

services:
  campaignLore:
    # Secret that you create. It holds the embedding endpoint key under the key api-key.
    embeddingApiKeySecret: campaign-lore-embedding

# Daily PostgreSQL backup to an S3-compatible bucket outside the cluster (TASK-0961).
# The keys access-key and secret-key come from the Secret named in backup.credentialsSecret.
# Add the key encryption-passphrase to that Secret when encryption.enabled is true.
backup:
  enabled: true
  # HTTPS endpoint outside the cluster. Use the bucket owner's endpoint. The guard rejects http://.
  endpoint: https://REPLACE-ME
  bucket: REPLACE-ME
  # Secret that you create. It holds the keys access-key and secret-key for the bucket.
  credentialsSecret: runefoble-backup-credentials
  # S3 client image, pinned by digest. It needs no shell.
  image: cgr.dev/chainguard/minio-client@sha256:47e7c343d1e0f0ae23ebd23d3ed095dffaa0ac397ec75a871829a6f9e075134c
  # Cron schedule in UTC. The default runs daily at 02:17.
  schedule: "17 2 * * *"
  # Documentation only. The bucket lifecycle rule enforces this period. The chart never deletes objects.
  retentionDays: 30
  encryption:
    enabled: false

# Restore of one backup into a fresh release (TASK-0961). Off by default. Turn it on for one install.
restore:
  enabled: false
  # Prefix that the backup Job logs, for example postgres/2026-11-18. Required when enabled is true.
  objectPrefix: ""
