{{- if .Values.openpanel.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openpanel
  labels:
    app: openpanel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openpanel
  template:
    metadata:
      labels:
        app: openpanel
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      containers:
        - name: openpanel
          image: {{ .Values.openpanel.image }}
          {{- with .Values.openpanel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.openpanel.port }}
          env:
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@postgres:5432/openpanel"
---
apiVersion: v1
kind: Service
metadata:
  name: openpanel
  labels:
    app: openpanel
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.openpanel.port }}
      targetPort: {{ .Values.openpanel.port }}
  selector:
    app: openpanel
{{- end }}
