{{- if .Values.redis.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: runefoble-redis
  labels:
    app: runefoble-redis
spec:
  serviceName: runefoble-redis
  replicas: 1
  selector:
    matchLabels:
      app: runefoble-redis
  template:
    metadata:
      labels:
        app: runefoble-redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # Append-only file on the data claim. Consumer groups and the stream entries survive a restart.
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: {{ .Values.redis.port }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.redis.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.redis.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    {{- include "runefoble.dataClaimTemplate" (dict "persistence" .Values.redis.persistence) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: runefoble-redis
  labels:
    app: runefoble-redis
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.redis.port }}
      targetPort: {{ .Values.redis.port }}
  selector:
    app: runefoble-redis
{{- end }}
