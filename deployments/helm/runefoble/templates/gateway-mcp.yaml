{{- /*
  gateway-mcp: MCP tools over streamable HTTP (TASK-0623). ClusterIP only. The chart adds
  no ingress rule for it, so the public ingress never reaches the MCP endpoint.
*/ -}}
{{- $mcp := .Values.services.gatewayMcp }}
{{- $hosted := include "runefoble.hosted.profile" $ }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-mcp
  labels:
    app: gateway-mcp
spec:
  replicas: {{ $mcp.replicas | default 1 }}
  selector:
    matchLabels:
      app: gateway-mcp
  template:
    metadata:
      labels:
        app: gateway-mcp
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      {{- if include "runefoble.hosted.profile" $ }}
      securityContext:
        {{- include "runefoble.hosted.podSecurity" (dict "extra" nil) | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway-mcp
          image: {{ $mcp.image }}
          {{- with $mcp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ $mcp.port }}
          env:
            {{- include "runefoble.serviceCredentialEnv" $ | nindent 12 }}
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "RUNEFOBLE_SPICEDB_PRESHARED_KEY" "key" "spicedb-preshared-key") | nindent 12 }}
            {{- include "runefoble.zitadelServiceEnv" $ | nindent 12 }}
            {{- include "runefoble.serviceUrlEnv" (dict "root" $ "consumer" "gateway-mcp") | trim | nindent 12 }}
          {{- include "runefoble.probes" $mcp | nindent 10 }}
          {{- if $hosted }}
          securityContext:
            {{- include "runefoble.hosted.appContainerSecurity" (dict "uid" ($mcp.runAsUser | default 10001) "readOnly" true) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if $hosted }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-mcp
  labels:
    app: gateway-mcp
spec:
  type: ClusterIP
  ports:
    - port: {{ $mcp.port }}
      targetPort: {{ $mcp.port }}
  selector:
    app: gateway-mcp
