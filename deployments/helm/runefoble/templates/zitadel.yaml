{{- if .Values.zitadel.enabled -}}
{{- /*
Zitadel writes the admin machine user's PAT to ZITADEL_FIRSTINSTANCE_PATPATH on first start.
The pat-publisher sidecar reads that file from the shared emptyDir and applies the Secret named
by zitadel.bootstrap.adminSecret. The Role below may touch only that Secret by name.
*/ -}}
{{- $patDir := "/zitadel/bootstrap" -}}
{{- $patPath := printf "%s/admin.pat" $patDir -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zitadel
  labels:
    app: zitadel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zitadel
  labels:
    app: zitadel
rules:
  # Server-side apply creates the Secret on the first run.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.zitadel.bootstrap.adminSecret | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zitadel
  labels:
    app: zitadel
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zitadel
subjects:
  - kind: ServiceAccount
    name: zitadel
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zitadel
  labels:
    app: zitadel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zitadel
  template:
    metadata:
      labels:
        app: zitadel
    spec:
      serviceAccountName: zitadel
      # Kubernetes would inject ZITADEL_PORT=tcp://<ip>:8080 from the Service named zitadel. Zitadel
      # reads ZITADEL_PORT as its listen port and fails to start. Turn off the service variables.
      enableServiceLinks: false
      containers:
        - name: zitadel
          image: {{ .Values.zitadel.image }}
          args: ["start-from-init", "--masterkeyFromEnv", "--tlsMode", "disabled"]
          ports:
            - containerPort: {{ .Values.zitadel.port }}
          volumeMounts:
            - name: bootstrap
              mountPath: {{ $patDir }}
          env:
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "ZITADEL_MASTERKEY" "key" "zitadel-masterkey") | nindent 12 }}
            - name: ZITADEL_FIRSTINSTANCE_PATPATH
              value: {{ $patPath | quote }}
            - name: ZITADEL_EXTERNALDOMAIN
              value: {{ .Values.zitadel.externalDomain | quote }}
            - name: ZITADEL_EXTERNALPORT
              value: {{ .Values.zitadel.externalPort | quote }}
            - name: ZITADEL_EXTERNALSECURE
              value: {{ .Values.zitadel.externalSecure | quote }}
            - name: ZITADEL_DATABASE_POSTGRES_HOST
              value: "postgres"
            - name: ZITADEL_DATABASE_POSTGRES_PORT
              value: "5432"
            - name: ZITADEL_DATABASE_POSTGRES_DATABASE
              value: "zitadel"
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "runefoble.credentialsSecret" $ }}
                  key: postgres-password
            - name: ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE
              value: "disable"
            - name: ZITADEL_DATABASE_POSTGRES_USER_USERNAME
              value: {{ .Values.postgres.username | quote }}
            - name: ZITADEL_DATABASE_POSTGRES_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "runefoble.credentialsSecret" $ }}
                  key: postgres-password
            - name: ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE
              value: "disable"
            # Machine user with IAM_OWNER. Zitadel prints its personal access token to the container
            # log on first start. The bootstrap Job needs that token (zitadel.bootstrap.adminSecret).
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME
              value: {{ .Values.zitadel.bootstrap.machineUsername | quote }}
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME
              value: "Runefoble bootstrap"
            - name: ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE
              value: {{ .Values.zitadel.bootstrap.patExpirationDate | quote }}
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME
              value: "admin"
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME
              value: "Runefoble"
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME
              value: "Admin"
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL
              value: {{ .Values.zitadel.adminEmail | quote }}
            - name: ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "runefoble.credentialsSecret" $ }}
                  key: zitadel-admin-password
            {{- if .Values.mailpit.enabled }}
            - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST
              value: "mailpit:{{ .Values.mailpit.smtpPort | default 1025 }}"
            - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER
              value: ""
            - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD
              value: ""
            # Zitadel reads TLS, FROM, and FROMNAME one level above SMTP (DefaultInstance.SMTPConfiguration).
            # A wrong name is ignored. Then the host is set and the sender is empty, so setup fails
            # with Errors.Invalid.Argument in step 03_default_instance.
            - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS
              value: "false"
            - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM
              value: {{ .Values.zitadel.adminEmail | default "noreply@runefoble.local" | quote }}
            - name: ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME
              value: "Runefoble"
            # The sender is not in the instance domain (auth.localhost). Turn off the check.
            - name: ZITADEL_DEFAULTINSTANCE_DOMAINPOLICY_SMTPSENDERADDRESSMATCHESINSTANCEDOMAIN
              value: "false"
            {{- end }}
        - name: pat-publisher
          image: {{ .Values.services.gatewayApi.image }}
          command: ["python", "-m", "runefoble_auth.zitadel_pat_publisher"]
          volumeMounts:
            - name: bootstrap
              mountPath: {{ $patDir }}
              readOnly: true
          env:
            - name: ZITADEL_PAT_PATH
              value: {{ $patPath | quote }}
            - name: ZITADEL_ADMIN_SECRET_NAME
              value: {{ .Values.zitadel.bootstrap.adminSecret | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBERNETES_API_URL
              value: "https://kubernetes.default.svc"
      volumes:
        - name: bootstrap
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zitadel
  labels:
    app: zitadel
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.zitadel.port }}
      targetPort: {{ .Values.zitadel.port }}
  selector:
    app: zitadel
{{- end }}
