apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: {{ .Values.frontend.replicas | default 1 }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        checksum/runtime-config: {{ include (print $.Template.BasePath "/frontend-runtime-config.yaml") . | sha256sum }}
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      # The init container fills in the client ID and project ID from the Secret that the bootstrap
      # Job writes. The pod waits until that Secret exists.
      initContainers:
        - name: render-runtime-config
          image: {{ .Values.frontend.image }}
          {{- with .Values.frontend.initResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy | default "IfNotPresent" }}
          command: ["sh", "-c"]
          args:
            - >-
              sed -e "s|__RUNEFOBLE_CLIENT_ID__|${RUNEFOBLE_CLIENT_ID}|"
              -e "s|__RUNEFOBLE_PROJECT_ID__|${RUNEFOBLE_PROJECT_ID}|"
              /template/runtime-config.json > /runtime/runtime-config.json
          env:
            - name: RUNEFOBLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "runefoble.zitadelClientSecretName" $ }}
                  key: client-id
            - name: RUNEFOBLE_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "runefoble.zitadelClientSecretName" $ }}
                  key: project-id
          volumeMounts:
            - name: runtime-config-template
              mountPath: /template
              readOnly: true
            - name: runtime-config
              mountPath: /runtime
      containers:
        - name: frontend
          image: {{ .Values.frontend.image }}
          {{- with .Values.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          volumeMounts:
            - name: runtime-config
              mountPath: /usr/share/nginx/html/runtime-config.json
              subPath: runtime-config.json
              readOnly: true
      volumes:
        - name: runtime-config-template
          configMap:
            name: frontend-runtime-config
        - name: runtime-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
  selector:
    app: frontend
