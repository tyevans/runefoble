{{- if .Values.postgres.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-multidb
  labels:
    app: postgres
data:
  init-multidb.sh: |
    #!/bin/bash
    set -e
    set -u

    create_database() {
        local database=$1
        echo "Provisioning database '$database' for user '$POSTGRES_USER'..."
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
            SELECT 'CREATE DATABASE ' || quote_ident('$database') || ' OWNER ' || quote_ident('$POSTGRES_USER')
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '$database')\gexec
            GRANT ALL PRIVILEGES ON DATABASE "$database" TO "$POSTGRES_USER";
    EOSQL
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$database" <<-EOSQL
            GRANT ALL ON SCHEMA public TO "$POSTGRES_USER";
    EOSQL
    }

    DATABASES="${POSTGRES_MULTIPLE_DATABASES:-zitadel,spicedb,openpanel}"
    for db in $(echo "$DATABASES" | tr ',' ' '); do
        create_database "$db"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password }}
            - name: POSTGRES_MULTIPLE_DATABASES
              value: {{ .Values.postgres.multipleDatabases | default "zitadel,spicedb,openpanel" | quote }}
          volumeMounts:
            - name: init-multidb
              mountPath: /docker-entrypoint-initdb.d/init-multidb.sh
              subPath: init-multidb.sh
      volumes:
        - name: init-multidb
          configMap:
            name: postgres-init-multidb
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
  selector:
    app: postgres
{{- end }}
