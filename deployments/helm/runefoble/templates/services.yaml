{{- $services := list
  (dict "name" "gateway-api" "config" .Values.services.gatewayApi)
  (dict "name" "the-watcher" "config" .Values.services.theWatcher)
  (dict "name" "board-state" "config" .Values.services.boardState)
  (dict "name" "character-sheet" "config" .Values.services.characterSheet)
  (dict "name" "game-session" "config" .Values.services.gameSession)
  (dict "name" "voice-agent" "config" .Values.services.voiceAgent)
  (dict "name" "campaign-lore" "config" .Values.services.campaignLore)
  (dict "name" "rules-compendium" "config" .Values.services.rulesCompendium)
-}}

{{- range $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  replicas: {{ .config.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .config.image }}
          ports:
            - containerPort: {{ .config.port }}
          env:
            - name: RUNEFOBLE_DATABASE_URL
              value: "postgresql+asyncpg://{{ $.Values.postgres.username }}:{{ $.Values.postgres.password }}@postgres:5432/{{ $.Values.postgres.database }}"
            - name: RUNEFOBLE_USE_POSTGRES_EVENT_STORE
              value: "true"
            - name: RUNEFOBLE_SILO_ENDPOINT
              value: "silo:{{ $.Values.silo.port }}"
            - name: RUNEFOBLE_ZITADEL_ISSUER
              value: {{ include "runefoble.zitadelIssuer" $ | quote }}
            - name: RUNEFOBLE_ZITADEL_JWKS_URL
              value: {{ include "runefoble.zitadelJwksUrl" $ | quote }}
            - name: RUNEFOBLE_SPICEDB_ENDPOINT
              value: "spicedb:{{ $.Values.spicedb.grpcPort }}"
            - name: RUNEFOBLE_SPICEDB_PRESHARED_KEY
              value: {{ $.Values.spicedb.presharedKey | quote }}
            - name: REDIS_URL
              value: "redis://runefoble-redis:{{ $.Values.redis.port }}/0"
            - name: RUNEFOBLE_REDIS_URL
              value: "redis://runefoble-redis:{{ $.Values.redis.port }}/0"
            - name: RUNEFOBLE_OTEL_ENABLED
              value: "{{ $.Values.observability.enabled }}"
            - name: RUNEFOBLE_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:{{ $.Values.observability.otelCollector.grpcPort }}"
          {{- if eq .name "game-session" }}
            - name: RUNEFOBLE_VOICE_AGENT_URL
              value: "http://voice-agent:{{ $.Values.services.voiceAgent.port }}"
            - name: RUNEFOBLE_CHARACTER_SHEET_URL
              value: "http://character-sheet:{{ $.Values.services.characterSheet.port }}"
          {{- end }}
            {{- range $name, $value := .config.env }}
            {{- if $value }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with .config.embeddingApiKeySecret }}
            - name: RUNEFOBLE_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: api-key
            {{- end }}
          {{- if eq .name "voice-agent" }}
            - name: RUNEFOBLE_VOICE_STT_MODEL_SIZE
              value: {{ .config.sttModelSize | quote }}
            - name: RUNEFOBLE_VOICE_STT_MODEL_DIR
              value: {{ .config.modelCache.mountPath | quote }}
            - name: RUNEFOBLE_VOICE_STT_DOWNLOAD_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .config.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: {{ .config.modelCache.mountPath | quote }}
          {{- end }}
      {{- if eq .name "voice-agent" }}
      securityContext:
        fsGroup: 10001
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: voice-agent-model-cache
      {{- end }}
---

apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .config.port }}
      targetPort: {{ .config.port }}
  selector:
    app: {{ .name }}
{{- end }}
