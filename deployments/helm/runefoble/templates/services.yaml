{{- /*
  One ConfigMap (when configMap is set), Deployment and Service for every entry in .Values.services
  that does not set ownTemplate. The entry key in kebab-case is the Kubernetes name. Per-service
  differences are keys of the entry (see the services map in values.yaml).
*/ -}}
{{- range $key, $svc := .Values.services }}
{{- if not $svc.ownTemplate }}
{{- $name := kebabcase $key }}
{{- $useModelCache := and $svc.modelCache (or (not $svc.sttEngine) (eq $svc.sttEngine "faster-whisper")) }}
{{- $hosted := include "runefoble.hosted.profile" $ }}
{{- if $svc.configMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    app: {{ $name }}
data:
  {{- toYaml $svc.configMap | nindent 2 }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      containers:
        - name: {{ $name }}
          image: {{ $svc.image }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $hosted }}
          securityContext:
            {{- include "runefoble.hosted.appContainerSecurity" (dict "uid" ($svc.runAsUser | default 10001) "readOnly" true) | nindent 12 }}
          {{- end }}
          {{- with $svc.configMap }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
          {{- end }}
          env:
            {{- if $hosted }}
            - name: HOME
              value: "/tmp"
            {{- end }}
            {{- include "runefoble.platformEnv" (dict "root" $ "svc" $svc) | trim | nindent 12 }}
            {{- if $svc.siloCredentials }}
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "RUNEFOBLE_SILO_ACCESS_KEY" "key" "silo-access-key") | nindent 12 }}
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "RUNEFOBLE_SILO_SECRET_KEY" "key" "silo-secret-key") | nindent 12 }}
            {{- end }}
            {{- if $svc.serviceCredential }}
            {{- include "runefoble.serviceCredentialEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $svc.zitadelProvisioner }}
            {{- include "runefoble.zitadelProvisionerEnv" $ | nindent 12 }}
            {{- end }}
            {{- if $svc.trustedProxy }}
            - name: RUNEFOBLE_TRUSTED_PROXY_CIDRS
              value: {{ $.Values.ingress.trustedProxyCidrs | quote }}
            {{- end }}
            {{- if or (not (hasKey $svc "eventStore")) $svc.eventStore }}
            - name: RUNEFOBLE_EVENT_STORE_BACKEND
              value: "postgresql"
            {{- end }}
            {{- if or (not (hasKey $svc "environment")) $svc.environment }}
            - name: RUNEFOBLE_ENVIRONMENT
              value: {{ $.Values.global.environment | quote }}
            {{- end }}
            {{- if or (not (hasKey $svc "siloEndpoint")) $svc.siloEndpoint }}
            - name: RUNEFOBLE_SILO_ENDPOINT
              value: "silo:{{ $.Values.silo.port }}"
            {{- end }}
            {{- include "runefoble.serviceUrlEnv" (dict "root" $ "consumer" $name) | trim | nindent 12 }}
            {{- range $envName, $value := $svc.env }}
            {{- if $value }}
            - name: {{ $envName }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- with $svc.sttEngine }}
            - name: RUNEFOBLE_VOICE_STT_ENGINE
              value: {{ . | quote }}
            {{- end }}
            {{- with $svc.sttBaseUrl }}
            - name: RUNEFOBLE_VOICE_STT_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with $svc.embeddingApiKeySecret }}
            - name: RUNEFOBLE_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: api-key
            {{- end }}
          {{- include "runefoble.probes" $svc | nindent 10 }}
          {{- if or $useModelCache $hosted }}
          volumeMounts:
            {{- if $useModelCache }}
            - name: model-cache
              mountPath: {{ $svc.modelCache.mountPath | quote }}
            {{- end }}
            {{- if $hosted }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
          {{- end }}
      {{- if $hosted }}
      securityContext:
        {{- include "runefoble.hosted.podSecurity" (dict "extra" $svc.podSecurityContext) | nindent 8 }}
      {{- else }}
      {{- with $svc.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- if or $useModelCache $hosted }}
      volumes:
        {{- if $useModelCache }}
        - name: model-cache
          persistentVolumeClaim:
            claimName: {{ $name }}-model-cache
        {{- end }}
        {{- if $hosted }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
  selector:
    app: {{ $name }}
{{- end }}
{{- end }}
