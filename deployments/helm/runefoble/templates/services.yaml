{{- $services := list
  (dict "name" "gateway-api" "config" .Values.services.gatewayApi)
  (dict "name" "the-watcher" "config" .Values.services.theWatcher)
  (dict "name" "board-state" "config" .Values.services.boardState)
  (dict "name" "character-sheet" "config" .Values.services.characterSheet)
  (dict "name" "game-session" "config" .Values.services.gameSession)
  (dict "name" "voice-agent" "config" .Values.services.voiceAgent)
  (dict "name" "campaign-lore" "config" .Values.services.campaignLore)
  (dict "name" "rules-compendium" "config" .Values.services.rulesCompendium)
-}}

{{- /*
  Cross-service URLs. Each key is an env var. Its URL uses the target's service port.
  `consumers` lists the containers that receive the key. Keys render in sorted order.
*/ -}}
{{- $serviceUrls := dict
  "RUNEFOBLE_WATCHER_URL" (dict "url" (printf "http://the-watcher:%v" .Values.services.theWatcher.port) "consumers" (list "game-session" "voice-agent"))
  "RUNEFOBLE_VOICE_AGENT_URL" (dict "url" (printf "http://voice-agent:%v" .Values.services.voiceAgent.port) "consumers" (list "game-session"))
  "SOUNDSCAPE_SERVICE_URL" (dict "url" (printf "http://soundscape:%v" .Values.services.soundscape.port) "consumers" (list "gateway-api"))
  "CAMPAIGN_LORE_URL" (dict "url" (printf "http://campaign-lore:%v" .Values.services.campaignLore.port) "consumers" (list "gateway-api"))
  "CAMPAIGN_ANALYTICS_URL" (dict "url" (printf "http://campaign-analytics:%v" .Values.services.campaignAnalytics.port) "consumers" (list "gateway-api"))
  "RUNEFOBLE_CHARACTER_SHEET_URL" (dict "url" (printf "http://character-sheet:%v" .Values.services.characterSheet.port) "consumers" (list "game-session"))
  "CHARACTER_SHEET_URL" (dict "url" (printf "http://character-sheet:%v" .Values.services.characterSheet.port) "consumers" (list "gateway-api"))
  "RUNEFOBLE_GAME_SESSION_URL" (dict "url" (printf "http://game-session:%v" .Values.services.gameSession.port) "consumers" (list "gateway-api"))
  "RUNEFOBLE_RULES_COMPENDIUM_URL" (dict "url" (printf "http://rules-compendium:%v" .Values.services.rulesCompendium.port) "consumers" (list "gateway-api"))
-}}
{{- with .Values.services.inferenceWorker }}
{{- $_ := set $serviceUrls "RUNEFOBLE_INFERENCE_URL" (dict "url" (printf "http://inference-worker:%v" .port) "consumers" (list "the-watcher")) }}
{{- end }}

{{- range $services }}
{{- $svcName := .name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  replicas: {{ .config.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
        - name: {{ .name }}
          image: {{ .config.image }}
          ports:
            - containerPort: {{ .config.port }}
          env:
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "RUNEFOBLE_SPICEDB_PRESHARED_KEY" "key" "spicedb-preshared-key") | nindent 12 }}
            - name: RUNEFOBLE_DATABASE_URL
              value: "postgresql+asyncpg://{{ $.Values.postgres.username }}:$(POSTGRES_PASSWORD)@postgres:5432/{{ $.Values.postgres.database }}"
            - name: RUNEFOBLE_EVENT_STORE_BACKEND
              value: "postgresql"
            - name: RUNEFOBLE_ENVIRONMENT
              value: {{ $.Values.global.environment | quote }}
            - name: RUNEFOBLE_SILO_ENDPOINT
              value: "silo:{{ $.Values.silo.port }}"
            {{- include "runefoble.zitadelServiceEnv" $ | nindent 12 }}
            - name: RUNEFOBLE_SPICEDB_ENDPOINT
              value: "spicedb:{{ $.Values.spicedb.grpcPort }}"
            - name: REDIS_URL
              value: "redis://runefoble-redis:{{ $.Values.redis.port }}/0"
            - name: RUNEFOBLE_REDIS_URL
              value: "redis://runefoble-redis:{{ $.Values.redis.port }}/0"
            - name: RUNEFOBLE_OTEL_ENABLED
              value: "{{ $.Values.observability.enabled }}"
            - name: RUNEFOBLE_OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:{{ $.Values.observability.otelCollector.grpcPort }}"
            {{- range $envName, $entry := $serviceUrls }}
            {{- if has $svcName $entry.consumers }}
            - name: {{ $envName }}
              value: {{ $entry.url | quote }}
            {{- end }}
            {{- end }}
            {{- range $name, $value := .config.env }}
            {{- if $value }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if has .name (list "gateway-api" "the-watcher" "board-state" "character-sheet" "game-session" "rules-compendium") }}
            {{- include "runefoble.serviceCredentialEnv" $ | nindent 12 }}
            {{- end }}
            {{- with .config.embeddingApiKeySecret }}
            - name: RUNEFOBLE_EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: api-key
            {{- end }}
          {{- if eq .name "voice-agent" }}
            - name: RUNEFOBLE_VOICE_STT_MODEL_SIZE
              value: {{ .config.sttModelSize | quote }}
            - name: RUNEFOBLE_VOICE_STT_MODEL_DIR
              value: {{ .config.modelCache.mountPath | quote }}
            - name: RUNEFOBLE_VOICE_STT_DOWNLOAD_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .config.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: model-cache
              mountPath: {{ .config.modelCache.mountPath | quote }}
          {{- end }}
      {{- if eq .name "voice-agent" }}
      securityContext:
        fsGroup: 10001
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: voice-agent-model-cache
      {{- end }}
---

apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels:
    app: {{ .name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .config.port }}
      targetPort: {{ .config.port }}
  selector:
    app: {{ .name }}
{{- end }}
