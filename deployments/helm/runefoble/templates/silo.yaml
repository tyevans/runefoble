{{- if .Values.silo.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: silo
  labels:
    app: silo
spec:
  serviceName: silo
  replicas: 1
  selector:
    matchLabels:
      app: silo
  template:
    metadata:
      labels:
        app: silo
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      {{- if include "runefoble.hosted.profile" $ }}
      securityContext:
        {{- include "runefoble.hosted.podSecurity" (dict "extra" nil) | nindent 8 }}
      {{- end }}
      containers:
        - name: silo
          image: {{ .Values.silo.image }}
          {{- if include "runefoble.hosted.profile" $ }}
          securityContext:
            {{- include "runefoble.hosted.thirdPartyContainerSecurity" $ | nindent 12 }}
          {{- end }}
          {{- with .Values.silo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["server", "/data", "--console-address", ":{{ .Values.silo.consolePort }}"]
          ports:
            - containerPort: {{ .Values.silo.port }}
            - containerPort: {{ .Values.silo.consolePort }}
          env:
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "MINIO_ROOT_USER" "key" "silo-access-key") | nindent 12 }}
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "MINIO_ROOT_PASSWORD" "key" "silo-secret-key") | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    {{- include "runefoble.dataClaimTemplate" (dict "persistence" .Values.silo.persistence) | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: silo
  labels:
    app: silo
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: {{ .Values.silo.port }}
      targetPort: {{ .Values.silo.port }}
    - name: console
      port: {{ .Values.silo.consolePort }}
      targetPort: {{ .Values.silo.consolePort }}
  selector:
    app: silo
{{- end }}
