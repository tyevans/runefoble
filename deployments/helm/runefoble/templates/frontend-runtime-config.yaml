apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-runtime-config
  labels:
    app: frontend
data:
  runtime-config.json: |
    {{- dict
      "issuer" (include "runefoble.zitadelIssuer" .)
      "clientId" .Values.frontend.runtimeConfig.clientId
      "scopes" .Values.frontend.runtimeConfig.scopes
      "providerName" .Values.frontend.runtimeConfig.providerName
      | toPrettyJson | nindent 4 }}
