{{- with .Values.services.inferenceWorker }}
{{- $hosted := include "runefoble.hosted.profile" $ }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-worker
  labels:
    app: inference-worker
spec:
  replicas: {{ .replicas | default 1 }}
  selector:
    matchLabels:
      app: inference-worker
  template:
    metadata:
      labels:
        app: inference-worker
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      {{- if include "runefoble.hosted.profile" $ }}
      securityContext:
        {{- include "runefoble.hosted.podSecurity" (dict "extra" nil) | nindent 8 }}
      {{- end }}
      containers:
        - name: inference-worker
          image: {{ .image }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .port }}
          env:
            {{- include "runefoble.serviceCredentialEnv" $ | nindent 12 }}
            - name: RUNEFOBLE_WORKER_HOST
              value: "0.0.0.0"
            - name: RUNEFOBLE_WORKER_PORT
              value: {{ .port | quote }}
            - name: RUNEFOBLE_WORKER_BACKEND
              value: {{ .backend | quote }}
            - name: RUNEFOBLE_WORKER_OPENAI_BASE_URL
              value: {{ .openaiCompatibleBaseUrl | quote }}
            {{- if .openaiCompatibleModel }}
            - name: RUNEFOBLE_WORKER_OPENAI_MODEL
              value: {{ .openaiCompatibleModel | quote }}
            {{- end }}
            {{- /* The API key comes from a Secret (ADR-0015 e). Unset names add no entry. */ -}}
            {{- with .openaiApiKeySecret }}
            {{- if .name }}
            - name: RUNEFOBLE_WORKER_OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .name | quote }}
                  key: {{ required "services.inferenceWorker.openaiApiKeySecret.key must name a key when name is set" .key | quote }}
            {{- end }}
            {{- end }}
            {{- /* An unset value adds no entry, so the worker default applies. Zero is a value. */ -}}
            {{- with .ollamaBaseUrl }}
            - name: RUNEFOBLE_WORKER_OLLAMA_BASE_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .ollamaModel }}
            - name: RUNEFOBLE_WORKER_OLLAMA_MODEL
              value: {{ . | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .temperature) }}
            - name: RUNEFOBLE_WORKER_TEMPERATURE
              value: {{ .temperature | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .maxTokens) }}
            - name: RUNEFOBLE_WORKER_MAX_TOKENS
              value: {{ .maxTokens | quote }}
            {{- end }}
            {{- if not (kindIs "invalid" .timeoutSeconds) }}
            - name: RUNEFOBLE_WORKER_TIMEOUT_SECONDS
              value: {{ .timeoutSeconds | quote }}
            {{- end }}
            # The Redis Streams consumer stays off until a producer exists (ADR-0006).
            - name: RUNEFOBLE_WORKER_REDIS_ENABLED
              value: "false"
          {{- include "runefoble.probes" . | nindent 10 }}
          {{- if $hosted }}
          securityContext:
            {{- include "runefoble.hosted.appContainerSecurity" (dict "uid" (.runAsUser | default 10001) "readOnly" true) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      {{- if $hosted }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: inference-worker
  labels:
    app: inference-worker
spec:
  type: ClusterIP
  ports:
    - port: {{ .port }}
      targetPort: {{ .port }}
  selector:
    app: inference-worker
{{- end }}
