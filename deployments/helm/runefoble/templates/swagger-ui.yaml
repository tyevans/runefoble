{{- if .Values.swaggerUI.enabled -}}
{{- /* One entry per services item that sets swaggerName. Its spec is served at /openapi.json. */}}
{{- $urls := list }}
{{- range $key, $svc := .Values.services }}
{{- if $svc.swaggerName }}
{{- $urls = append $urls (dict "name" $svc.swaggerName "url" (printf "http://%s:%v/openapi.json" (kebabcase $key) $svc.port)) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger-ui
  labels:
    app: swagger-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swagger-ui
  template:
    metadata:
      labels:
        app: swagger-ui
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      containers:
        - name: swagger-ui
          image: {{ .Values.swaggerUI.image }}
          {{- with .Values.swaggerUI.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.swaggerUI.port }}
          env:
            - name: URLS
              value: {{ toJson $urls | quote }}
            - name: URLS_PRIMARY_NAME
              value: "Unified API Gateway"
---
apiVersion: v1
kind: Service
metadata:
  name: swagger-ui
  labels:
    app: swagger-ui
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.swaggerUI.port }}
      targetPort: {{ .Values.swaggerUI.port }}
  selector:
    app: swagger-ui
{{- end }}
