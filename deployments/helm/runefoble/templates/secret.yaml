{{- if empty .Values.credentials.existingSecret }}
{{- if ne .Values.global.environment "local" }}
{{- fail "credentials.existingSecret must name a Secret when global.environment is not local. The chart dev defaults in values.yaml must not reach a shared cluster." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: runefoble-credentials
  labels:
    app.kubernetes.io/part-of: runefoble
type: Opaque
stringData:
  silo-access-key: {{ .Values.credentials.silo.accessKey | quote }}
  silo-secret-key: {{ .Values.credentials.silo.secretKey | quote }}
  zitadel-masterkey: {{ .Values.credentials.zitadel.masterKey | quote }}
  zitadel-admin-password: {{ .Values.credentials.zitadel.adminPassword | quote }}
  spicedb-preshared-key: {{ .Values.credentials.spicedb.presharedKey | quote }}
  postgres-password: {{ .Values.credentials.postgres.password | quote }}
  grafana-admin-password: {{ .Values.credentials.grafana.adminPassword | quote }}
{{- end }}
