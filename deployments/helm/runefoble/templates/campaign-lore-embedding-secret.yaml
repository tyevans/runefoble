{{- /*
The campaign-lore pod reads the embedding endpoint key from this Secret (services.campaignLore).
The local environment renders an empty placeholder, because local embedding servers ignore the key.
Other environments create the Secret out of band, so the chart renders nothing there.
*/ -}}
{{- $secretName := .Values.services.campaignLore.embeddingApiKeySecret -}}
{{- if and $secretName (eq .Values.global.environment "local") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/part-of: runefoble
type: Opaque
stringData:
  api-key: ""
{{- end }}
