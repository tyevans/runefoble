{{- if .Values.spicedb.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicedb
  labels:
    app: spicedb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spicedb
  template:
    metadata:
      labels:
        app: spicedb
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      {{- if include "runefoble.hosted.profile" $ }}
      securityContext:
        {{- include "runefoble.hosted.podSecurity" (dict "extra" nil) | nindent 8 }}
      {{- end }}
      initContainers:
        - name: spicedb-migrate
          image: {{ .Values.spicedb.image }}
          {{- if include "runefoble.hosted.profile" $ }}
          securityContext:
            {{- include "runefoble.hosted.thirdPartyContainerSecurity" $ | nindent 12 }}
          {{- end }}
          {{- with .Values.spicedb.migrateResources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["datastore", "migrate", "head", "--datastore-engine", "postgres"]
          env:
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            - name: SPICEDB_DATASTORE_CONN_URI
              value: "postgres://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@postgres:5432/spicedb?sslmode=disable"
      containers:
        - name: spicedb
          image: {{ .Values.spicedb.image }}
          {{- if include "runefoble.hosted.profile" $ }}
          securityContext:
            {{- include "runefoble.hosted.thirdPartyContainerSecurity" $ | nindent 12 }}
          {{- end }}
          {{- with .Values.spicedb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args: ["serve", "--datastore-engine", "postgres"]
          ports:
            - name: grpc
              containerPort: {{ .Values.spicedb.grpcPort }}
            - name: http
              containerPort: {{ .Values.spicedb.httpPort }}
          env:
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "SPICEDB_GRPC_PRESHARED_KEY" "key" "spicedb-preshared-key") | nindent 12 }}
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "POSTGRES_PASSWORD" "key" "postgres-password") | nindent 12 }}
            - name: SPICEDB_DATASTORE_CONN_URI
              value: "postgres://{{ .Values.postgres.username }}:$(POSTGRES_PASSWORD)@postgres:5432/spicedb?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: spicedb
  labels:
    app: spicedb
spec:
  type: {{ .Values.spicedb.serviceType | default "ClusterIP" }}
  ports:
    - name: grpc
      port: {{ .Values.spicedb.grpcPort }}
      targetPort: {{ .Values.spicedb.grpcPort }}
    - name: http
      port: {{ .Values.spicedb.httpPort }}
      targetPort: {{ .Values.spicedb.httpPort }}
  selector:
    app: spicedb
{{- end }}
