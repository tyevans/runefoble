{{- if and .Values.spicedb.enabled .Values.spicedb.schemaJob.enabled -}}
{{- /*
Schema writer (TASK-0933). It is a plain ConfigMap and Job, not Helm hooks. The app pods wait for
the schema (spicedb_probe reads it), so a post-install hook would deadlock `helm install --wait`.
The Job name carries a hash of the schema and the client image, because a Job spec is immutable.
*/ -}}
{{- $schemaHash := printf "%s|%s" (.Files.Get "files/runefoble.zed") .Values.spicedb.schemaJob.image | sha256sum | trunc 8 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: spicedb-schema
  labels:
    app: spicedb-schema
data:
  runefoble.zed: |-
{{ .Files.Get "files/runefoble.zed" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spicedb-schema-migration-{{ $schemaHash }}
  labels:
    app: spicedb-schema-migration
spec:
  backoffLimit: {{ .Values.spicedb.schemaJob.backoffLimit | default 10 }}
  template:
    metadata:
      labels:
        app: spicedb-schema-migration
    spec:
      {{- include "runefoble.imagePullSecrets" $ }}
      {{- if include "runefoble.hosted.profile" $ }}
      securityContext:
        {{- include "runefoble.hosted.podSecurity" (dict "extra" nil) | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
      # No migration here. The spicedb Deployment migrates the datastore in its init container.
      # A second migration at install time deadlocks on CREATE INDEX CONCURRENTLY. This Job
      # retries until the spicedb Service answers.
      containers:
        - name: schema-writer
          image: {{ .Values.spicedb.schemaJob.image | quote }}
          {{- if include "runefoble.hosted.profile" $ }}
          securityContext:
            {{- include "runefoble.hosted.thirdPartyContainerSecurity" $ | nindent 12 }}
          {{- end }}
          {{- with .Values.spicedb.schemaJob.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - zed
            - schema
            - write
            - /etc/spicedb/schema/runefoble.zed
            - --endpoint
            - "spicedb:{{ .Values.spicedb.grpcPort }}"
            - --insecure
          env:
            {{- include "runefoble.secretEnv" (dict "root" $ "name" "ZED_TOKEN" "key" "spicedb-preshared-key") | nindent 12 }}
          volumeMounts:
            - name: schema-volume
              mountPath: /etc/spicedb/schema
              readOnly: true
      volumes:
        - name: schema-volume
          configMap:
            name: spicedb-schema
{{- end }}
