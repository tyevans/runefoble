[project]
name = "gateway-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
    "runefoble-auth",
    "runefoble-platform",
    "runefoble-events",
    "websockets>=16.1.1",
]

[tool.pytest.ini_options]
# The gateway tests run from this package. They reuse the shared test helpers in the root `tests/`
# folder, so the repository root joins the import path.
testpaths = ["tests"]
pythonpath = [".", "../.."]
timeout = 300
timeout_method = "signal"
